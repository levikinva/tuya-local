name: Ventilator with heater
products:
  - id: 9mqdhwklpvnnvb7t
    manufacturer: Tion
    model: Breezer Bio X
entities:
  - entity: fan
    translation_key: ventilation
    dps:
      - id: 101
        type: boolean
        name: switch
      - id: 102
        type: integer
        name: speed
        range:
          min: 1
          max: 7
      - id: 105
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: false
            value: fresh
          - dps_val: true
            value: circulate
  - entity: climate
    # The heater only warms the incoming air, it does not control room
    # temperature. The current temperature is the air at the outlet.
    translation_key: heater
    dps:
      # The heater has no separate switch: a target of 0 turns it off.
      - id: 114
        type: integer
        name: hvac_mode
        mapping:
          - dps_val: 0
            value: "off"
          - dps_val: 10
            value: heat
          - value: heat
      - id: 114
        type: integer
        name: temperature
        unit: C
        range:
          min: 0
          max: 30
      - id: 108
        type: integer
        name: current_temperature
      - id: 117
        type: boolean
        name: hvac_action
        mapping:
          - dps_val: true
            value: heating
          - value: idle
      - id: 118
        type: string
        name: heater_type
      - id: 120
        type: integer
        name: heater_power
  - entity: sensor
    class: temperature
    translation_key: outlet_temperature
    dps:
      - id: 108
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    class: temperature
    translation_key: inlet_temperature
    dps:
      - id: 112
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    translation_key: filter_life
    dps:
      - id: 115
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: sensor
    class: carbon_dioxide
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: ppm
        class: measurement
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    class: pm25
    dps:
      - id: 116
        type: integer
        name: sensor
        unit: µg/m³
        class: measurement
      - id: 123
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    class: humidity
    dps:
      - id: 119
        type: integer
        name: sensor
        unit: "%"
        class: measurement
      - id: 124
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 132
        type: boolean
        name: switch
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 111
        type: boolean
        name: lock
  - entity: select
    translation_key: display_brightness
    category: config
    dps:
      - id: 104
        type: string
        name: option
        mapping:
          - dps_val: "0"
            value: "off"
          - dps_val: "50"
            value: dim
          - dps_val: "100"
            value: bright
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: select
    name: Panel color
    icon: "mdi:palette"
    category: config
    dps:
      - id: 133
        type: string
        name: option
        mapping:
          - dps_val: color0
            value: Turquoise
          - dps_val: color1
            value: Purple
          - dps_val: color2
            value: Green
          - dps_val: color3
            value: White
          - dps_val: color4
            value: Yellow
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 110
        type: boolean
        name: button
  - entity: number
    name: Filter replacement interval
    icon: "mdi:calendar-check"
    category: config
    dps:
      - id: 134
        type: integer
        name: value
        unit: d
        range:
          min: 30
          max: 365
  # Automatic mode uses the built-in CO2 sensor, which only the SM
  # variants have; dp 122 reports "absent" on the others.
  - entity: switch
    name: Automatic mode
    icon: "mdi:fan-auto"
    category: config
    dps:
      - id: 131
        type: boolean
        name: switch
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Automatic mode target CO2
    icon: "mdi:molecule-co2"
    category: config
    dps:
      - id: 130
        type: integer
        name: value
        unit: ppm
        range:
          min: 400
          max: 1500
        mapping:
          - step: 50
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Automatic mode maximum speed
    icon: "mdi:fan-chevron-up"
    category: config
    dps:
      - id: 128
        type: integer
        name: value
        range:
          min: 1
          max: 7
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: number
    name: Automatic mode minimum speed
    icon: "mdi:fan-chevron-down"
    category: config
    dps:
      - id: 129
        type: integer
        name: value
        range:
          min: 0
          max: 1
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: button
    name: Calibrate CO2 sensor
    icon: "mdi:molecule-co2"
    category: config
    dps:
      - id: 136
        type: boolean
        name: button
      - id: 122
        type: string
        name: available
        mapping:
          - dps_val: absent
            value: false
          - dps_val: null
            value: false
          - value: true
  - entity: sensor
    name: Total operating time
    class: duration
    category: diagnostic
    dps:
      - id: 113
        type: integer
        name: sensor
        unit: s
        class: total_increasing
  - entity: sensor
    name: Error code
    icon: "mdi:alert-circle-outline"
    category: diagnostic
    dps:
      - id: 127
        type: string
        name: sensor
